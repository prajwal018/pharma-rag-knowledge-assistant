services:
  - type: web
    name: pharma-knowledge-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/ui.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
